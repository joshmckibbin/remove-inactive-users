name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Tag Version
        id: get_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify Version Consistency
        run: |
          PLUGIN_VERSION=$(grep "Version:" remove-inactive-users.php | sed 's/.*Version: *\([0-9.]*\).*/\1/')
          CONSTANT_VERSION=$(grep "JM_REMOVE_INACTIVE_USERS_VERSION" remove-inactive-users.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
          README_VERSION=$(grep "Stable tag:" readme.txt | sed 's/.*Stable tag: *\([0-9.]*\).*/\1/')
          
          echo "Plugin file version: $PLUGIN_VERSION"
          echo "Plugin constant version: $CONSTANT_VERSION"
          echo "Readme stable tag: $README_VERSION"
          echo "Git tag version: ${{ steps.get_version.outputs.version }}"

          if [ "$PLUGIN_VERSION" != "${{ steps.get_version.outputs.version }}" ] || \
            [ "$CONSTANT_VERSION" != "${{ steps.get_version.outputs.version }}" ] || \
            [ "$README_VERSION" != "${{ steps.get_version.outputs.version }}" ]; then
            echo "❌ Version mismatch detected!"
            echo "Please ensure all versions match the git tag version: ${{ steps.get_version.outputs.version }}"
            exit 1
          fi
          echo "✅ All versions match!"

      - name: Create Release Package
        run: |
          # Create temporary directory for the plugin
          mkdir -p /tmp/remove-inactive-users
          
          # Copy plugin files (excluding development files)
          rsync -av \
            --exclude='.editorconfig' \
            --exclude='.git*' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='assets/' \
            --exclude='*.md' \
            --exclude='phpcs.xml' \
            ./ /tmp/remove-inactive-users/
          
          # Create ZIP file
          cd /tmp
          zip -r remove-inactive-users-${{ steps.get_version.outputs.version }}.zip remove-inactive-users/

          # Move ZIP to workspace
          mv remove-inactive-users-${{ steps.get_version.outputs.version }}.zip $GITHUB_WORKSPACE/

      - name: Generate Changelog
        id: build_changelog
        run: |
          # Extract changelog for current version from readme.txt
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # Find the changelog section and extract content for this version
          awk "
          /^== Changelog ==/ { in_changelog=1; next }
          in_changelog && /^= $VERSION =/ { in_version=1; next }
          in_changelog && in_version && /^= [0-9]/ && !/^= $VERSION =/ { exit }
          in_changelog && in_version { print }
          " readme.txt > CHANGELOG.md
          
          # If changelog is empty, create a basic one
          if [ ! -s CHANGELOG.md ]; then
            echo "Release $VERSION" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "See \`readme.txt\` for full changelog details." >> CHANGELOG.md
          fi
          
          # Set output for use in release notes
          {
            echo 'changelog<<EOF'
            cat CHANGELOG.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Remove Inactive Users v${{ steps.get_version.outputs.version }}
          body: |
            ## Changes in v${{ steps.get_version.outputs.version }}

            ${{ steps.build_changelog.outputs.changelog }}
            
            ## Manual Installation

            1. Download the `remove-inactive-users-${{ steps.get_version.outputs.version }}.zip` file
            2. Upload to WordPress via Plugins > Add New > Upload Plugin
            3. Activate the plugin

            ## WP-CLI Installation

            ```bash
            wp plugin install --activate https://github.com/joshmckibbin/remove-inactive-users/releases/download/v${{ steps.get_version.outputs.version }}/remove-inactive-users-${{ steps.get_version.outputs.version }}.zip
            ```

            ## Configuration and Usage

            1. Go to Settings > Remove Inactive Users to configure the plugin settings.
            2. Go to Users > Manage Inactive Users to run the plugin.

            ## Requirements

            - WordPress 6.0 or higher
            - PHP 8.0 or higher
          files: |
            remove-inactive-users-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: remove-inactive-users-${{ steps.get_version.outputs.version }}
          path: remove-inactive-users-${{ steps.get_version.outputs.version }}.zip
          retention-days: 30
